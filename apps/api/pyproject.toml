[project]
name = "hypersignal-api"
version = "0.1.0"
description = "Stateless RSS/Atom feed proxy for the Hypersignal panel"
readme = "README.md"
authors = [
    { name = "haxybaxy", email = "zaidsaheb4@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "asgi-lifespan>=2.1.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PT", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
